name: GBS Hospital CI & Render Continuous Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GBS_OFFICIAL_ACCOUNT_EMAIL: gabosei48@gmail.com
  RENDER_SERVICE_NAME: gbs-hospital

jobs:
  verify-and-build:
    name: Build, Verify & Prepare Render Deployment
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Admin123
          POSTGRES_DB: gbs_hospital
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build Frontend Production Bundle
        working-directory: ./Frontend
        env:
          VITE_GBS_ENV: PRODUCTION
          VITE_API_URL: /api/v1
        run: |
          npm install
          npm run build

      - name: Install Backend Dependencies & Generate Prisma Client
        working-directory: ./Backend
        env:
          DATABASE_URL: postgresql://postgres:Admin123@localhost:5432/gbs_hospital?schema=public
          NODE_ENV: test
          JWT_ACCESS_SECRET: gbs_ci_access_secret_key_2026_hospital_enterprise
          JWT_REFRESH_SECRET: gbs_ci_refresh_secret_key_2026_hospital_enterprise
        run: |
          npm install
          npx prisma generate
          npx prisma db push

      - name: Run Backend Automated Verification Suite
        working-directory: ./Backend
        env:
          DATABASE_URL: postgresql://postgres:Admin123@localhost:5432/gbs_hospital?schema=public
          NODE_ENV: test
          JWT_ACCESS_SECRET: gbs_ci_access_secret_key_2026_hospital_enterprise
          JWT_REFRESH_SECRET: gbs_ci_refresh_secret_key_2026_hospital_enterprise
        run: |
          npm test

      - name: Trigger Render.com Production Deploy Hook (if configured)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Triggered Render.com deployment for gbs-hospital (gabosei48@gmail.com)"
          else
            echo "Render autoDeploy is enabled via render.yaml GitHub integration."
          fi
