services:
  - type: web
    name: gbs-hospital
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GBS_ENV
        value: PRODUCTION
      - key: PORT
        value: 5000
      - key: GBS_OFFICIAL_ACCOUNT_EMAIL
        value: gabosei48@gmail.com
      - key: DATABASE_URL
        fromDatabase:
          name: gbs-hospital-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://gbs-hospital.onrender.com

databases:
  - name: gbs-hospital-postgres
    databaseName: gbs_hospital
    user: gbs_hospital_admin
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

