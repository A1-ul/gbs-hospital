services:
  - type: web
    name: gbs-hospital-system
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GBS_ENV
        value: PRODUCTION
      - key: PORT
        value: 5000
      - key: DEMO_MODE_ENABLED
        value: "false"
      - key: RENDER_SERVICE_NAME
        value: gbs-hospital-system
      - key: PRODUCTION_PUBLIC_URL
        value: https://gbs-hospital-system.onrender.com
      - key: GBS_OFFICIAL_ACCOUNT_EMAIL
        value: gabosei48@gmail.com
      - key: DEVELOPER_ROOT_EMAIL
        value: gabosei48@gmail.com
      - key: DEVELOPER_ROOT_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://gbs-hospital-system.onrender.com
